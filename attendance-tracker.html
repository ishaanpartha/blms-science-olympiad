<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BLMS Science Olympiad — Attendance Tracker</title>

<style>
/* ------------------------------------------------------
   BASE PAGE SETUP (CENTER EVERYTHING)
------------------------------------------------------- */
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI",
               Roboto, Arial, sans-serif;

  background: linear-gradient(135deg, #e9f0ff, #f7f8ff);
  margin: 0;
  padding-top: 120px;          /* space for nav */
  padding-bottom: 40px;

  display: flex;
  justify-content: flex-start;
  align-items: center;
  flex-direction: column;
}

/* ------------------------------------------------------
   NAV BAR
------------------------------------------------------- */
.nav {
  position: fixed;
  top: 18px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;

  display: flex;
  gap: 14px;
  padding: 10px 16px;

  background: rgba(255, 255, 255, 0.25);
  backdrop-filter: blur(14px);
  border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, 0.3);
}

.nav a {
  color: #111;
  font-weight: 600;
  text-decoration: none;
}

.nav a.active {
  background: linear-gradient(90deg, #007aff, #9b7bff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  font-weight: 800;
}

/* ------------------------------------------------------
   MAIN CENTERED CONTAINER
------------------------------------------------------- */
.container {
  width: 100%;
  max-width: 1000px;

  margin-left: auto;
  margin-right: auto;

  background: rgba(255, 255, 255, 0.7);
  border-radius: 20px;
  padding: 32px 36px;

  box-shadow: 0 10px 26px rgba(0,0,0,.15);

  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

/* ------------------------------------------------------
   TOOLBAR
------------------------------------------------------- */
.toolbar {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
  margin-top: 10px;
}

.toolbar input[type="date"] {
  padding: 10px 14px;
  border-radius: 10px;
  border: 1px solid #ccc;
  font-size: 1rem;
}

/* Shared button style */
.btn {
  padding: 10px 18px;
  border-radius: 12px;
  border: none;
  color: white;
  font-weight: 600;
  cursor: pointer;
}

.btn-green { background: #10b981; }
.btn-red   { background: #ef4444; }
.btn-yellow{ background: #f59e0b; }
.btn-gray  { background: #6b7280; }
.btn-blue  { background: #6366f1; }
.btn-purple{ background: #9b7bff; }

/* ------------------------------------------------------
   STUDENT GRID
------------------------------------------------------- */
.grid {
  margin-top: 16px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(285px, 1fr));
  gap: 12px;

  width: 100%;
  max-width: 900px;

  margin-left: auto;
  margin-right: auto;
}

.card {
  display: flex;
  align-items: center;
  gap: 10px;

  border: 1px solid rgba(0, 0, 0, 0.10);
  border-radius: 12px;
  padding: 10px 14px;
  background: rgba(255,255,255,0.55);
}

/* Status dot */
.status-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #d1d5db;
  border: 1px solid rgba(0,0,0,0.15);
}
.card[data-status="P"] .status-dot { background: #10b981; }
.card[data-status="A"] .status-dot { background: #ef4444; }
.card[data-status="E"] .status-dot { background: #f59e0b; }

/* ------------------------------------------------------
   FLAGGED STUDENTS
------------------------------------------------------- */
.irregular-yellow {
  border: 2px solid #facc15 !important;
  box-shadow: 0 0 10px rgba(250,204,21,0.6);
}
.irregular-red {
  border: 2px solid #ef4444 !important;
  box-shadow: 0 0 12px rgba(239,68,68,0.7);
}

/* ------------------------------------------------------
   TOAST
------------------------------------------------------- */
.toast {
  position: fixed;
  left: 50%; transform: translateX(-50%);
  bottom: 22px;
  padding: 10px 16px;
  border-radius: 10px;
  background: #10b981;
  color: white;
  opacity: 0;
  pointer-events: none;
  transition: opacity .35s ease;
}
.toast.show { opacity: 1; }

/* ------------------------------------------------------
   RESPONSIVE FIXES
------------------------------------------------------- */
@media (max-width: 700px) {
  .container {
    padding: 20px 18px;
  }
  .grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<!-- ======================================================
     NAVIGATION
====================================================== -->
<nav class="nav">
  <a href="index.html" data-page="index">🏠 Home</a>
  <a href="roster.html" data-page="roster">👥 Team Roster</a>
  <a href="attendance-tracker.html" data-page="attendance-tracker">🗓️ Attendance Tracker</a>
  <a href="attendance-report.html" data-page="attendance-report">📊 Attendance Report</a>
</nav>

<!-- ======================================================
     LOGIN OVERLAY
====================================================== -->
<div id="loginOverlay" style="
  position: fixed; inset:0;
  background: rgba(0,0,0,.8);
  display:flex; align-items:center; justify-content:center;
  z-index:9999;">
  <div style="
    background:white; padding:28px; border-radius:18px;
    width:min(420px,92vw); text-align:center;">
    <h2 style="color:#007aff">Teacher Access</h2>
    <input id="pw" type="password"
      placeholder="Enter password"
      style="width:100%; padding:11px 14px; margin-top:12px; border-radius:10px;">
    <button id="loginBtn" class="btn btn-blue" style="margin-top:14px;">Login</button>
    <div id="loginErr" style="color:#ef4444; margin-top:8px; height:18px;"></div>
  </div>
</div>

<!-- ======================================================
     MAIN ATTENDANCE APP
====================================================== -->
<div class="container" id="app" style="display:none;">

  <h1 style="
      text-align:center;
      margin-bottom:14px;
      background:linear-gradient(90deg,#007aff,#9b7bff);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;">
    Attendance — BLMS Science Olympiad
  </h1>

  <!-- Toolbar -->
  <div class="toolbar">
    <label>
      Date:
      <input type="date" id="datePicker">
    </label>

    <button id="markP" class="btn btn-green">Present</button>
    <button id="markA" class="btn btn-red">Absent</button>
    <button id="markE" class="btn btn-yellow">Excused</button>

    <button id="clearSel" class="btn btn-gray">Clear</button>

    <button id="submitBtn" class="btn btn-blue">Submit</button>

    <button id="excuseDayBtn" class="btn btn-purple">Excuse Entire Day</button>
  </div>

  <p id="excuseMsg"
     style="display:none; text-align:center; color:#007aff; font-weight:700; margin-top:10px;">
  </p>

  <div style="display:flex; justify-content:center; gap:10px; margin:10px 0;">
    <label style="display:flex; align-items:center; gap:6px;">
      <input type="checkbox" id="selectAll">
      Select all
    </label>
    <span id="selCount">0 selected</span>
  </div>

  <div class="grid" id="list"></div>
</div>

<div class="toast" id="toast">Attendance recorded</div>

<!-- ======================================================
     JAVASCRIPT SECTION (YOUR FEATURES)
====================================================== -->
<script>
/* ==========================================================
   CONFIG
========================================================== */
const SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbyoBlmpsgE_IhSnuH5ao9LgNzOtwkmqnbupyFno04QUN01Pcuk30eX09xIs1GlklTDi/exec";
const TEACHER_PASSWORD = "Science123";

const students = [
  "Aarav Singh Mandhar","Shreya Ayyalasomayajula","Yvaine Wang","Junye Huang",
  "Sanvi Byreddy","Vinay Patel","Saanvika Nair","Ryan Thomas","Anay Chatterjee",
  "Dhruv Bajaj","Sofia Shao","Akshay Bhargav Varanasi","Edmund Bao","Pavel Chudnovskiy",
  "Anvika Rath","Jayden Oh","William Wang","Akhil Gollapally","Joann Antony",
  "Nora Ahmed","Haasini Bharathwaj","Anvi Dhome","Krishvee Anand","Rayansh Anand",
  "Pavaki Rastogi","Samira Senthil","Ishani Bhat","Zayna Rasheed",
  "Ishaan Parthasarathy","Aarav Singhai"
];

/* ==========================================================
   LOGIN
========================================================== */
loginBtn.onclick = () => {
  if (pw.value === TEACHER_PASSWORD) {
    sessionStorage.setItem("att_ok","1");
    loginOverlay.style.display="none";
    app.style.display="block";
  } else loginErr.textContent = "Incorrect password.";
};

if (sessionStorage.getItem("att_ok") === "1") {
  loginOverlay.style.display="none";
  app.style.display="block";
}

/* ==========================================================
   RENDER STUDENTS
========================================================== */
function renderList() {
  list.innerHTML = "";
  students.forEach(name => {
    const row = document.createElement("div");
    row.className = "card";
    row.dataset.name = name;

    row.innerHTML = `
      <input type="checkbox" class="pick">
      <span class="status-dot"></span>
      <label>${name}</label>
    `;

    list.appendChild(row);
  });
}
renderList();

/* Helpers */
function getCheckedRows() {
  return [...document.querySelectorAll(".pick:checked")]
         .map(cb => cb.closest(".card"));
}

function updateSel() {
  selCount.textContent =
    document.querySelectorAll(".pick:checked").length + " selected";
}
list.addEventListener("change", updateSel);

selectAll.onchange = () => {
  [...document.querySelectorAll(".pick")].forEach(cb =>
    cb.checked = selectAll.checked
  );
  updateSel();
};

/* Marking */
markP.onclick = () => getCheckedRows().forEach(r => r.dataset.status="P");
markA.onclick = () => getCheckedRows().forEach(r => r.dataset.status="A");
markE.onclick = () => getCheckedRows().forEach(r => r.dataset.status="E");

clearSel.onclick = () => {
  document.querySelectorAll(".pick").forEach(cb => cb.checked=false);
  updateSel();
};

/* ==========================================================
   TOAST
========================================================== */
function showToast(msg="Attendance recorded") {
  toast.textContent = msg;
  toast.classList.add("show");
  setTimeout(()=>toast.classList.remove("show"),1500);
}

/* ==========================================================
   WEDNESDAY ONLY LOGIC
========================================================== */
function getWednesday(d) {
  let date = new Date(d);
  let day = date.getDay(); // 0=Sun ... 3=Wed
  let diff = day <= 3 ? (3-day) : (3-day+7);
  date.setDate(date.getDate()+diff);
  return date;
}

let today = new Date();
let thisWed = getWednesday(today);
datePicker.value = thisWed.toISOString().split("T")[0];

datePicker.onchange = () => {
  const d = new Date(datePicker.value);
  if (d.getDay() !== 3) {
    alert("Only Wednesdays allowed.");
    datePicker.value = getWednesday(d).toISOString().split("T")[0];
  }
};

/* ==========================================================
   EXCUSE ENTIRE DAY
========================================================== */
excuseDayBtn.onclick = async () => {
  const date = datePicker.value;
  if (!confirm(`Excuse EVERYONE on ${date}?`)) return;

  await fetch(SCRIPT_URL, {
    method:"POST",
    mode:"no-cors",
    body: JSON.stringify([{date, name:"ALL", status:"EXCUSED_DAY"}])
  });

  excuseMsg.style.display="block";
  excuseMsg.textContent = `Everyone excused for ${date}`;
  list.style.display="none";
  submitBtn.disabled = true;

  showToast("Excused Day Saved");
};

/* ==========================================================
   IRREGULAR STUDENT FLAGS
========================================================== */
let history = [];

async function loadHistory() {
  let res = await fetch(SCRIPT_URL);
  history = await res.json();
  computeIrregularFlags();
}

function computeIrregularFlags() {
  let byName = {};

  history.forEach(r => {
    if (r.status === "EXCUSED_DAY") return;
    if (!byName[r.name]) byName[r.name] = [];
    byName[r.name].push(r.status);
  });

  document.querySelectorAll(".card").forEach(card => {
    const name = card.dataset.name;
    const list = byName[name] || [];

    const totalA = list.filter(s => s==="A").length;

    let streak = 0;
    for (let i=list.length-1; i>=0; i--) {
      if (list[i] === "A") streak++;
      else break;
    }

    card.classList.remove("irregular-yellow","irregular-red");

    if (totalA >= 5) card.classList.add("irregular-red");
    else if (streak >= 3) card.classList.add("irregular-yellow");
  });
}
loadHistory();

/* ==========================================================
   SUBMIT ATTENDANCE
========================================================== */
submitBtn.onclick = async () => {
  const date = datePicker.value;

  const rows = [...document.querySelectorAll(".card")]
    .filter(r => r.dataset.status)
    .map(r => ({
      date,
      name: r.dataset.name,
      status: r.dataset.status
    }));

  if (rows.length === 0) {
    alert("No students marked.");
    return;
  }

  await fetch(SCRIPT_URL, {
    method:"POST",
    mode:"no-cors",
    body:JSON.stringify(rows)
  });

  showToast();

  document.querySelectorAll(".card").forEach(r => r.dataset.status="");
  clearSel();
  loadHistory();
};
</script>

</body>
</html>
